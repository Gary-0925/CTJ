<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>CTJ</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        font:
          14px/1.5 system-ui,
          "Segoe UI",
          "Microsoft YaHei",
          sans-serif;
        background: #16181d;
        color: #e6e6e6;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        padding: 8px 12px;
        background: #1e2128;
        border-bottom: 1px solid #2c303a;
      }
      header h1 {
        font-size: 15px;
        margin: 0 12px 0 0;
        font-weight: 600;
      }
      header .sub {
        color: #8a90a0;
        font-size: 12px;
        margin-right: auto;
      }
      select,
      button {
        font: inherit;
        color: #e6e6e6;
        background: #262a33;
        border: 1px solid #3a3f4b;
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
      }
      button:hover {
        background: #303541;
      }
      button.primary {
        background: #2f6feb;
        border-color: #2f6feb;
        color: #fff;
      }
      button.primary:hover {
        background: #3d7bf0;
      }
      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: minmax(0, 1fr) minmax(0, 40%);
        gap: 1px;
        background: #2c303a;
        min-height: 0;
      }
      section {
        background: #16181d;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      h2 {
        margin: 0;
        padding: 5px 12px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #9aa1b1;
        text-transform: uppercase;
        background: #1e2128;
      }
      textarea,
      pre {
        margin: 0;
        padding: 10px 12px;
        overflow: auto;
        min-height: 0;
        font:
          13px/1.55 ui-monospace,
          "Cascadia Code",
          Consolas,
          monospace;
        background: #16181d;
        color: #e6e6e6;
        border: 0;
        resize: none;
        white-space: pre;
        tab-size: 2;
      }
      textarea {
        flex: 1;
      }
      textarea:focus {
        outline: 1px solid #2f6feb;
      }
      #warnings {
        min-height: 5%;
        max-height: 10%;
        overflow: auto;
        padding: 6px 12px;
        font-size: 12px;
        color: #e0b341;
        background: #1c1a14;
        border-top: 1px solid #3a3220;
        display: none;
      }
      #warnings div {
        white-space: pre-wrap;
      }
      #stdin {
        flex: none;
        height: 96px;
        border-top: 1px solid #2c303a;
      }
      #output {
        flex: 1;
        min-height: 10%;
        border-top: 1px solid #2c303a;
      }
      #output.err {
        color: #f0717a;
      }
      #shapes {
        grid-column: 1 / -1;
        min-height: 0;
      }
      #shapes-body {
        flex: 1;
        overflow: auto;
        padding: 8px 12px;
        min-height: 0;
        color: #9aa1b1;
        font-size: 13px;
      }
      #shapes-body .snap + .snap {
        margin-top: 14px;
      }
      #shapes-body h3 {
        margin: 0 0 4px;
        font: 600 13px/1.4 ui-monospace, Consolas, monospace;
        color: #e6e6e6;
      }
      #shapes-body svg {
        display: block;
        max-width: 100%;
      }
      footer {
        padding: 4px 12px;
        font-size: 12px;
        color: #6f7686;
        background: #1e2128;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>CTJ</h1>
      <span class="sub">C++ to JavaScript</span>
      <select id="example" title="示例"></select>
      <button id="transpile">转译 (Ctrl+Enter)</button>
      <button id="run" class="primary">运行</button>
      <button id="copy">复制 JavaScript</button>
    </header>
    <main>
      <section>
        <h2>C++ 源码</h2>
        <textarea id="source" spellcheck="false"></textarea>
      </section>
      <section>
        <h2>JavaScript 转译结果</h2>
        <pre id="code"></pre>
        <div id="warnings"></div>
        <h2>输入</h2>
        <textarea id="stdin" spellcheck="false"></textarea>
        <h2>输出</h2>
        <pre id="output"></pre>
      </section>
      <section id="shapes">
        <h2>数据形态</h2>
        <div id="shapes-body"></div>
      </section>
    </main>
    <footer><span id="status"></span></footer>

    <script src="./dist/ctj.js"></script>
    <script>
      "use strict";

      // Each example reads its data from standard input (cin / scanf / getline)
      // and writes its result to standard output.
      const EXAMPLES = [
        {
          name: "基础",
          code: `#include <iostream>
using namespace std;

int main() {
  int n;
  cin >> n;
  long long sum = 0;
  int best = 0;
  for (int i = 0; i < n; i++) {
    int x;
    cin >> x;
    sum += x;
    if (i == 0 || x > best) best = x;
  }
  cout << "sum = " << sum << "\\n";
  cout << "max = " << best << "\\n";
  return 0;
}
`,
          input: "5\n3 -1 4 1 5\n",
        },
        {
          name: "指针",
          code: `#include <cstdio>
#include <iostream>
using namespace std;

int a[100];

void reverseRange(int* lo, int* hi) {
  while (lo < hi) {
    int t = *lo;
    *lo++ = *--hi;
    *hi = t;
  }
}

int main() {
  int n;
  cin >> n;
  for (int i = 0; i < n; i++) cin >> a[i];
  reverseRange(a, a + n);
  for (int i = 0; i < n; i++) printf("%d%c", a[i], i + 1 < n ? ' ' : '\\n');
  return 0;
}
`,
          input: "5\n1 2 3 4 5\n",
        },
        {
          name: "类继承",
          code: `#include <iostream>
#include <string>
using namespace std;

struct Shape {
  virtual ~Shape() {}
  virtual double area() const = 0;
  virtual string name() const = 0;
};

struct Rect : Shape {
  double w, h;
  Rect(double w, double h) : w(w), h(h) {}
  double area() const { return w * h; }
  string name() const { return "rect"; }
};

struct Square : Rect {
  Square(double s) : Rect(s, s) {}
  string name() const { return "square"; }
};

int main() {
  int n;
  cin >> n;
  for (int i = 0; i < n; i++) {
    string kind;
    cin >> kind;
    Shape* s;
    if (kind == "square") {
      double a;
      cin >> a;
      s = new Square(a);
    } else {
      double w, h;
      cin >> w >> h;
      s = new Rect(w, h);
    }
    cout << s->name() << " " << s->area() << "\\n";
    delete s;
  }
  return 0;
}
`,
          input: "3\nrect 2 3.5\nsquare 4\nrect 1 1\n",
        },
        {
          name: "模板类",
          code: `#include <iostream>
using namespace std;

template <typename T>
T maxOf(T a, T b) { return a > b ? a : b; }

template <typename T, int N>
struct Stack {
  T data[N];
  int top;
  Stack() : top(0) {}
  void push(T v) { data[top++] = v; }
  T pop() { return data[--top]; }
  bool empty() const { return top == 0; }
};

int main() {
  Stack<int, 16> st;
  int n;
  cin >> n;
  int best = 0;
  for (int i = 0; i < n; i++) {
    int x;
    cin >> x;
    st.push(x);
    best = maxOf(best, x);
  }
  cout << "max = " << best << "\\n";
  while (!st.empty()) cout << st.pop() << "\\n";
  return 0;
}
`,
          input: "4\n2 9 4 7\n",
        },
        {
          name: "标准库",
          code: `#include <algorithm>
#include <iostream>
#include <map>
#include <string>
#include <vector>
using namespace std;

int main() {
  map<string, int> count;
  string w;
  while (cin >> w) count[w]++;
  vector<int> freq;
  for (map<string, int>::iterator it = count.begin(); it != count.end(); ++it) {
    cout << it->first << " " << it->second << "\\n";
    freq.push_back(it->second);
  }
  sort(freq.begin(), freq.end());
  cout << "distinct = " << count.size() << ", max freq = " << freq.back() << "\\n";
  return 0;
}
`,
          input: "the cat and the dog and the bird\n",
        },
        {
          name: "数据形态",
          code: `#include <iostream>
#include <string>
#include <vector>
using namespace std;
struct Node {
  int value;
  Node* next;
  Node(int v) : value(v), next(0) {}
};
struct Tree {
  int key;
  Tree* left;
  Tree* right;
  Tree(int k) : key(k), left(0), right(0) {}
};
Tree* insert(Tree* t, int k) {
  if (!t) return new Tree(k);
  if (k < t->key) t->left = insert(t->left, k);
  else t->right = insert(t->right, k);
  return t;
}
int main() {
  int n;
  cin >> n;
  Node* head = 0;
  Tree* root = 0;
  vector<string> names;
  for (int i = 0; i < n; i++) {
    int k;
    cin >> k;
    Node* node = new Node(k);
    node->next = head;
    head = node;
    root = insert(root, k);
    names.push_back("item" + to_string(k));
  }
  __ctj_show("list", head);
  __ctj_show("tree", root);
  __ctj_show("names", names);
  return 0;
}
`,
          input: "4\n5 3 8 1\n",
        },
      ];

      const $ = id => document.getElementById(id);
      let lastCode = "";
      let program = null; // the result of the last successful transpile; program.run(input) executes it

      function setStatus(text) {
        $("status").textContent = text;
      }

      // The header table is fetched once, when the page loads.
      const headersReady = fetch("./dist/include.json").then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      });
      headersReady.catch(err => setStatus("include.json 加载失败：" + err.message + "（请先运行 npm run build）"));

      function showOutput(text, isError) {
        $("output").textContent = text;
        $("output").className = isError ? "err" : "";
      }

      // Transpiles the source. Returns the program, or null after showing the error.
      async function transpile() {
        if (typeof CTJ === "undefined") {
          setStatus("dist/ctj.js 未加载，请先运行 npm run build 并通过 npm run serve 打开本页");
          return null;
        }
        let headers;
        try {
          headers = await headersReady;
        } catch (err) {
          setStatus("include.json 加载失败：" + err.message);
          return null;
        }
        $("warnings").style.display = "none";
        $("warnings").innerHTML = "";
        const t0 = performance.now();
        try {
          program = CTJ.transpile($("source").value, { headers });
        } catch (err) {
          program = null;
          lastCode = "";
          $("code").textContent = "";
          showOutput((err.file ? err.file + ":" + (err.line || 0) + ": " : "") + err.message, true);
          setStatus("转译失败");
          return null;
        }
        lastCode = program.code;
        $("code").textContent = lastCode;
        const warnings = program.warnings || [];
        warnings.slice(0, 50).forEach(w => {
          const d = document.createElement("div");
          d.textContent = w;
          $("warnings").appendChild(d);
        });
        if (warnings.length > 50) {
          const d = document.createElement("div");
          d.textContent = "… 另有 " + (warnings.length - 50) + " 条警告";
          $("warnings").appendChild(d);
        }
        if (warnings.length) $("warnings").style.display = "block";
        setStatus("转译完成，用时 " + (performance.now() - t0).toFixed(0) + " ms");
        return program;
      }

      // __ctj_show lines travel on the log channel; they are drawn in the shapes panel,
      // not printed with the rest of the log.
      const SHOW_TAG = "@@ctj-show ";
      const SVG_NS = "http://www.w3.org/2000/svg";
      const CHAR_W = 7.8;

      function shapeText(v) {
        switch (v.k) {
          case "int":
          case "float":
            return String(v.v);
          case "char":
            return v.v + " '" + String.fromCharCode(v.v) + "'";
          case "bool":
            return v.v ? "true" : "false";
          case "null":
            return "null";
          case "ptr":
            return "→";
          case "cstr":
          case "str":
            return JSON.stringify(v.v);
          case "struct":
            return "{" + v.f.map(f => shapeText(f.v)).join(", ") + "}";
          case "arr":
          case "vec":
            return "[" + v.items.map(shapeText).join(", ") + "]";
          default:
            return v.n || v.k;
        }
      }

      // The node ids a value points at, in order.
      function shapeTargets(v, out) {
        if (v.k === "ptr") out.push(v.to);
        else if (v.k === "struct") v.f.forEach(f => shapeTargets(f.v, out));
        else if (v.k === "arr" || v.k === "vec") v.items.forEach(x => shapeTargets(x, out));
        return out;
      }

      // One row per field: nested structs are flattened, base class fields join their owner.
      function shapeRows(label, v, rows) {
        if (v.k === "struct") {
          for (const f of v.f) {
            const sub = f.base ? label : (label ? label + "." : "") + f.n;
            shapeRows(sub, f.v, rows);
          }
          return rows;
        }
        rows.push({ label, text: shapeText(v), targets: shapeTargets(v, []) });
        return rows;
      }

      // Boxes for the root and every node, edges for every pointer, and a layout that puts
      // each box in the column of its distance from the root (BFS).
      function shapeLayout(snap) {
        const boxes = new Map();
        const rootRows = snap.root.k === "ptr" ? [{ label: "", text: "→", targets: [snap.root.to] }] : shapeRows("", snap.root, []);
        boxes.set("root", { id: "root", title: snap.label, rows: rootRows });
        for (const n of snap.nodes) {
          boxes.set("n" + n.id, { id: "n" + n.id, title: n.type, rows: shapeRows("", n.value, []) });
        }
        const depth = new Map([["root", 0]]);
        const order = ["root"];
        for (let qi = 0; qi < order.length; qi++) {
          const b = boxes.get(order[qi]);
          for (const r of b.rows) {
            for (const t of r.targets) {
              const id = "n" + t;
              if (boxes.has(id) && !depth.has(id)) {
                depth.set(id, depth.get(order[qi]) + 1);
                order.push(id);
              }
            }
          }
        }
        const cols = [];
        for (const id of order) {
          const c = depth.get(id);
          (cols[c] = cols[c] || []).push(boxes.get(id));
        }
        let x = 16;
        let maxY = 0;
        const edges = [];
        cols.forEach(col => {
          let colW = 0;
          for (const b of col) {
            let w = b.title.length * CHAR_W;
            for (const r of b.rows) w = Math.max(w, (r.label.length + 1 + r.text.length) * CHAR_W);
            b.w = Math.max(96, Math.ceil(w) + 24);
            b.h = 30 + b.rows.length * 20 + 8;
            colW = Math.max(colW, b.w);
          }
          let y = 16;
          for (const b of col) {
            b.x = x;
            b.y = y;
            y += b.h + 22;
          }
          maxY = Math.max(maxY, y);
          x += colW + 64;
        });
        for (const b of boxes.values()) {
          b.rows.forEach((r, i) => {
            for (const t of r.targets) {
              const to = boxes.get("n" + t);
              if (to) edges.push({ from: b, row: i, to });
            }
          });
        }
        return { boxes: [...boxes.values()], edges, width: Math.max(x, 120), height: Math.max(maxY, 60) };
      }

      function el(name, attrs, text) {
        const e = document.createElementNS(SVG_NS, name);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        if (text !== undefined) e.textContent = text;
        return e;
      }

      let shapeSeq = 0;
      function renderShape(snap) {
        const g = shapeLayout(snap);
        const svg = el("svg", { width: g.width, height: g.height, viewBox: `0 0 ${g.width} ${g.height}` });
        const marker = "ctj-arrow-" + shapeSeq++;
        const defs = el("defs", {});
        const mk = el("marker", { id: marker, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" });
        mk.appendChild(el("path", { d: "M0,0 L10,5 L0,10 z", fill: "#8ab4f8" }));
        defs.appendChild(mk);
        svg.appendChild(defs);
        for (const e of g.edges) {
          const x1 = e.from.x + e.from.w;
          const y1 = e.from.y + 30 + e.row * 20 + 10;
          const x2 = e.to.x;
          const y2 = e.to.y + 14;
          const dx = Math.max(40, Math.abs(x2 - x1) / 2);
          svg.appendChild(el("path", { d: `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`, fill: "none", stroke: "#8ab4f8", "stroke-width": 1.5, "marker-end": `url(#${marker})` }));
        }
        for (const b of g.boxes) {
          const grp = el("g", {});
          grp.appendChild(el("rect", { x: b.x, y: b.y, width: b.w, height: b.h, rx: 6, fill: "#1e2430", stroke: b.id === "root" ? "#e0b341" : "#5b7fa8" }));
          grp.appendChild(el("text", { x: b.x + 10, y: b.y + 19, fill: "#e6edf3", "font-family": "ui-monospace, Consolas, monospace", "font-size": 13, "font-weight": 700 }, b.title));
          grp.appendChild(el("line", { x1: b.x, y1: b.y + 26, x2: b.x + b.w, y2: b.y + 26, stroke: "#2c3445" }));
          b.rows.forEach((r, i) => {
            const ty = b.y + 30 + i * 20 + 14;
            if (r.label) grp.appendChild(el("text", { x: b.x + 10, y: ty, fill: "#9aa1b1", "font-family": "ui-monospace, Consolas, monospace", "font-size": 13 }, r.label));
            grp.appendChild(el("text", { x: b.x + 10 + (r.label ? (r.label.length + 1) * CHAR_W : 0), y: ty, fill: "#e6e6e6", "font-family": "ui-monospace, Consolas, monospace", "font-size": 13 }, r.text));
          });
          svg.appendChild(grp);
        }
        return svg;
      }

      function renderShapes(snaps) {
        const body = $("shapes-body");
        body.textContent = "";
        if (!snaps.length) {
          const hint = document.createElement("div");
          hint.textContent = "在程序中写 __ctj_show(\"标签\", 表达式); 即可在这里看到对象图。";
          body.appendChild(hint);
          return;
        }
        for (const snap of snaps) {
          const box = document.createElement("div");
          box.className = "snap";
          const h = document.createElement("h3");
          h.textContent = snap.label;
          box.appendChild(h);
          box.appendChild(renderShape(snap));
          body.appendChild(box);
        }
      }

      async function run() {
        renderShapes([]);
        const prog = await transpile();
        if (!prog) return;
        const res = prog.run($("stdin").value);
        const snaps = [];
        const logLines = [];
        for (const line of (res.stdlog || "").split("\n")) {
          if (line.startsWith(SHOW_TAG)) snaps.push(JSON.parse(line.slice(SHOW_TAG.length)));
          else logLines.push(line);
        }
        renderShapes(snaps);
        // stdout is the program's output; stderr and clog are shown after it.
        let text = res.stdout;
        for (const [body, label] of [
          [res.stderr, "[stderr]"],
          [logLines.join("\n"), "[clog]"],
        ]) {
          if (!body) continue;
          if (text && !text.endsWith("\n")) text += "\n";
          text += label + "\n" + body;
        }
        if (res.exitCode !== 0) {
          if (text && !text.endsWith("\n")) text += "\n";
          text += "退出码: " + res.exitCode;
        }
        showOutput(text, res.exitCode !== 0);
        setStatus(res.exitCode === 0 ? "运行完成" : "运行结束（退出码 " + res.exitCode + "）");
      }

      const exampleSelect = $("example");
      EXAMPLES.forEach((ex, i) => {
        const o = document.createElement("option");
        o.value = i;
        o.textContent = ex.name;
        exampleSelect.appendChild(o);
      });
      function loadExample(i) {
        const ex = EXAMPLES[i];
        $("source").value = ex.code;
        $("stdin").value = ex.input;
        $("code").textContent = "";
        $("warnings").style.display = "none";
        showOutput("", false);
        program = null;
        lastCode = "";
      }
      exampleSelect.addEventListener("change", () => loadExample(+exampleSelect.value));

      $("transpile").addEventListener("click", transpile);
      $("run").addEventListener("click", run);
      $("copy").addEventListener("click", () => {
        if (!lastCode) return;
        navigator.clipboard.writeText(lastCode).then(
          () => setStatus("已复制到剪贴板"),
          () => setStatus("复制失败")
        );
      });
      $("source").addEventListener("keydown", e => {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
          e.preventDefault();
          transpile();
        }
        if (e.key === "Tab") {
          e.preventDefault();
          const s = e.target,
            p = s.selectionStart;
          s.value = s.value.slice(0, p) + "  " + s.value.slice(s.selectionEnd);
          s.selectionStart = s.selectionEnd = p + 2;
        }
      });

      loadExample(0);
      exampleSelect.value = "0";
      if (typeof CTJ === "undefined") setStatus("dist/ctj.js 未加载，请先运行 npm run build 并通过 npm run serve 打开本页");
      else
        headersReady.then(
          () => setStatus("就绪" + (CTJ.version ? " · " + CTJ.version : "")),
          () => {}
        );
    </script>
  </body>
</html>
